# 같은 기계에 코어가 있을 때 덧씌운다 — 공유 네트워크에 붙인다.
#
#     docker compose -f docker-compose.yml -f docker-compose.link.yml --env-file .env up -d
#
# 여기서 얻는 것은 **임자가 봇을 만들 때 `http://sierra:8080` 같은 컨테이너 이름을 쓸 수 있게
# 되는 것**이다. 다만 사람이 닿는 주소(`BOT_PUBLIC_ORIGIN`)와 **선언 주소**는 그래도 공개
# HTTPS여야 한다 — 코어는 사설 대역을 두드리지 않는다(`PrivateAddressGuard`).

services:
  bot:
    networks:
      - core

networks:
  core:
    name: ${BOT_CORE_NETWORK:-miniwiki}
    external: true
